name: nextplay
description: Descoberta de jogos — NextPlay / PlaySweep.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  youtube_player_iframe: ^6.0.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  google_sign_in: ^6.2.1
  video_player: ^2.14.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
